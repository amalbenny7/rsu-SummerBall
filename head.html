<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Summer Ball 2027 — shared head
     Template path: SummerBall-prodtest/.head

     NOTE: never write an EE tag inside a comment. EE parses comments, so an
     embed tag written here would make this template call itself.

     Everything identical on every page of the microsite lives here: SEO,
     analytics, icons, fonts and the stylesheet. Change it once and every page
     picks it up.

     Page specific values come in as embed parameters, so the markup lives
     here and each page only passes values:

       page_title, page_description, canonical_path, share_image

     Order is load bearing: the two meta tags above stay at the very top of
     this file. A browser only scans the first 1024 bytes of the document for
     the charset, and this comment alone is most of that budget. Do not move
     anything above them. -->

<!-- ===================== PAGE META ===================== -->

<title>{embed:page_title}</title>
<meta name="description" content="{embed:page_description}">
<link rel="canonical" href="https://readingsu.co.uk{embed:canonical_path}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Reading Students' Union">
<meta property="og:locale" content="en_GB">
<meta property="og:title" content="{embed:page_title}">
<meta property="og:description" content="{embed:page_description}">
<meta property="og:url" content="https://readingsu.co.uk{embed:canonical_path}">
<meta property="og:image" content="{embed:share_image}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@ReadingUniSU">
<meta name="twitter:title" content="{embed:page_title}">
<meta name="twitter:description" content="{embed:page_description}">
<meta name="twitter:image" content="{embed:share_image}">

</script>
